<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SchemaGuard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="editor.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
</head>
<body>
  <header>
    <h1>SchemaGuard</h1>
    <label>Modo
      <select id="mode">
        <option value="beginner">Iniciante</option>
        <option value="intermediate">Intermediário</option>
        <option value="advanced">Avançado</option>
      </select>
    </label>
    <button id="new-table" type="button">Nova tabela</button>
    <button id="save-version" type="button">Salvar versão</button>
    <button id="compare" type="button">Comparar</button>
    <button id="export-sql" type="button">Exportar SQL</button>
    <button id="verify" type="button">Verificar</button>
    <button id="open-import" type="button">Importar SQL</button>
    <button id="theme" type="button" class="ghost">Tema claro</button>
  </header>

  <div id="work">
    <aside id="panel" hidden></aside>
    <main id="board">
      <svg id="links" aria-hidden="true"></svg>
      <p id="empty" hidden>Nenhuma tabela ainda. Clique em Nova tabela ou em Importar SQL.</p>
    </main>
  </div>

  <dialog id="dlg">
    <h2>Importar SQL</h2>
    <p>Aceita CREATE TABLE, ALTER TABLE ... ADD e CREATE INDEX. O esquema atual será substituído.</p>
    <textarea id="sql" rows="14" spellcheck="false"></textarea>
    <div class="actions">
      <button id="sample" type="button" class="ghost">Usar exemplo</button>
      <button id="cancel" type="button" class="ghost">Cancelar</button>
      <button id="do-import" type="button">Importar</button>
    </div>
  </dialog>

  <dialog id="out">
    <h2 id="out-title"></h2>
    <label>Dialeto
      <select id="dialect">
        <option value="postgresql">PostgreSQL</option>
        <option value="mysql">MySQL</option>
      </select>
    </label>
    <div id="out-body"></div>
    <div class="actions">
      <button id="copy" type="button" class="ghost">Copiar SQL</button>
      <button id="out-close" type="button">Fechar</button>
    </div>
  </dialog>

  <script src="app.js"></script>
  <script src="editor.js"></script>
  <script src="tools.js"></script>
  <script src="view.js"></script>
</body>
</html>
